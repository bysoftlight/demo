<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ - HR Paper Mill</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LineSeedSansTH/LineSeedSansTH.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center px-6 relative">

    <div class="text-center w-full max-w-sm">
        <h1 class="text-4xl font-bold text-blue-500 mb-2">HR Paper Mill</h1>
        <h2 class="text-lg font-bold text-black mb-1">โครงการใช้สิทธิ์สัมปทานผู้พิการ</h2>
        <h3 class="text-lg font-bold text-black mb-2">ตามมาตรา 35 ประจำปี 2569</h3>
        <p class="text-gray-400 text-sm mb-10">เว็บไซต์ HR Paper Mill Version 2.6(Beta)<br/>ปัจจุบันรองรับการใช้งานผ่านทุกอุปกรณ์</p>

        <div class="bg-white rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.05)] border border-gray-100">
            <h4 class="text-xl font-bold text-blue-500 mb-6">ส่วนที่ 1: เข้าสู่ระบบ</h4>
            
            <form id="login-form">
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">กรอกรหัสผู้ใช้สิทธิ์ *</label>
                    <input type="text" id="login-id" class="w-full bg-gray-50 text-center text-2xl font-bold tracking-widest text-gray-600 py-4 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-300 uppercase" placeholder="XXXXXX" maxlength="6">
                </div>

                <button type="submit" id="btn-login" class="w-full py-4 rounded-full text-white font-bold text-lg shadow-lg transition-all transform active:scale-95 bg-blue-300 cursor-not-allowed" disabled>
                    ตรวจสอบข้อมูล
                </button>
            </form>
            
            <div class="mt-4">
                <button class="text-gray-400 text-sm underline hover:text-gray-600">อ่านข้อปฏิบัติการใช้สิทธิ์</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
